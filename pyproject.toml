[project]
name = "aig-kg"
version = "0.1.0"
description = "EMR + OMOP knowledge graph for neurogenetic diseases (TTR/ATTR prototype)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=1.5",
    "networkx>=3.0",
]

[project.optional-dependencies]
viz = ["pyvis>=0.3", "matplotlib>=3.6"]
omop = ["duckdb>=0.9", "google-cloud-bigquery>=3.0"]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
